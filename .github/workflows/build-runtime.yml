name: Build source-captured FFmpeg

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-captured-ffmpeg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/shinchiro/archlinux@sha256:c7dffe77b57d98b10e327dde12d3977faf4cb90aa7cb4f5eeac4e9d68d724239
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime and capture sources
        shell: bash
        run: bash .github/runtime/build-runtime.sh "$GITHUB_WORKSPACE"
      - name: Verify output hashes
        shell: bash
        run: cd build/runtime-output && sha256sum --check SHA256SUMS.txt
      - name: Retain failure logs
        if: failure()
        shell: bash
        run: |
          mkdir -p build
          if [[ -d build/runtime-work ]]; then
            find build/runtime-work -type f \( -name '*.log' -o -name 'config.log' \) -print0 |
              tar --null --files-from=- --zstd -cf build/runtime-failure-logs.tar.zst
          else
            tar --zstd -cf build/runtime-failure-logs.tar.zst --files-from=/dev/null
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: runtime-failure-${{ github.sha }}
          path: build/runtime-failure-logs.tar.zst
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-candidate-${{ github.sha }}
          path: build/runtime-output/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: runtime-candidate-${{ github.sha }}
          path: build/runtime-candidate
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1
      - name: Prepare application and candidate runtime
        shell: pwsh
        run: |
          ./scripts/build.ps1
          $candidate = 'build/runtime-candidate'
          $record = Get-Content -Raw "$candidate/runtime-build-result.json" | ConvertFrom-Json
          foreach ($file in @($record.archive, $record.correspondingSource, $record.resolvedSources)) {
            $path = Join-Path $candidate $file.fileName
            if ((Get-Item $path).Length -ne $file.sizeBytes -or (Get-FileHash $path).Hash -ne $file.sha256) {
              throw "Runtime candidate hash or size mismatch: $path"
            }
          }
          Expand-Archive -LiteralPath (Join-Path $candidate $record.archive.fileName) -DestinationPath build/runtime -Force
          foreach ($binary in $record.binaries) {
            $path = Join-Path build/runtime $binary.fileName
            if ((Get-Item $path).Length -ne $binary.sizeBytes -or (Get-FileHash $path).Hash -ne $binary.sha256) {
              throw "Runtime binary hash or size mismatch: $path"
            }
            & $path -version
            if ($LASTEXITCODE -ne 0) { throw "Runtime tool failed: $path" }
          }
          $filters = & build/runtime/ffmpeg.exe -hide_banner -filters 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect runtime filters.' }
          foreach ($name in @('zscale', 'tonemap', 'limiter', 'interleave')) {
            if ($filters -notmatch "\b$name\b") { throw "Required filter is missing: $name" }
          }
          $encoders = & build/runtime/ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect runtime encoders.' }
          foreach ($name in @('libx264', 'libx265', 'h264_nvenc', 'hevc_nvenc', 'aac')) {
            if ($encoders -notmatch "\b$name\b") { throw "Required encoder is missing: $name" }
          }
      - name: Check media behavior with the candidate
        shell: pwsh
        run: |
          cargo test --locked --test media_flow -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-windows-checks-${{ github.sha }}
          path: build/test-output/
          if-no-files-found: warn
          retention-days: 14
