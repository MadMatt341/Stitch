[package]
name = "stitch"
version = "0.1.0"
edition = "2024"
description = "A small Windows video stitcher."
license = "MIT"
repository = "https://github.com/MadMatt341/Stitch"

[workspace]

[features]
native-ui-checks = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_SystemServices",
  "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_Security"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
